project:
  name: phishing-xai
  seed: 42
  version: "1.0.0"

paths:
  data_raw: data/raw
  data_processed: data/processed
  artifacts: artifacts
  plots: artifacts/plots
  metrics: artifacts/metrics
  model: artifacts/model.joblib
  feature_schema: artifacts/feature_schema.json

data:
  primary_url: "https://archive.ics.uci.edu/static/public/967/phiusiil+phishing+url+dataset.zip"
  label_col: label
  url_col: url
  phishing_label: 1
  legit_label: 0
  test_size: 0.15
  val_size: 0.15
  sample_size: 40000
  random_split_comparison: true

modeling:
  cv_folds: 5
  n_iter_search: 30
  threshold: 0.5
  models:
    - logistic_regression
    - decision_tree
    - random_forest
    - xgboost
    - lightgbm
    - mlp

explainability:
  shap_sample_size: 100
  lime_num_features: 15
  lime_num_samples: 200
  stability_perturbations: 4
  explanation_eval_sample: 60
  top_k_features: 10

api:
  host: "0.0.0.0"
  port: 8000
  max_url_length: 2000

app:
  port: 8501
